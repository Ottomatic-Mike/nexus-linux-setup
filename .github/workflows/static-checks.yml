name: static-checks

on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run static checks
        run: ./tests/static.sh

  ryujin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install pyusb Pillow
      - name: Test display bridge without hardware
        run: |
          python -m unittest discover -s ryujin/tests
          node --test ryujin/tests/adapter.test.cjs
